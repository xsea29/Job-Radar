# Render Blueprint: ONE web service (API + live updates + built-in scheduler) and a Postgres database.
# New Blueprint on Render → connect this repo → fill the prompted value (CORS_ORIGIN) → Apply.
# Docs: https://render.com/docs/blueprint-spec
#
# The web service runs everything itself, no separate cron needed:
#   daily  at 06:00 IST  → full scan, snapshot (if due), reports, notification decisions
#   every 60 minutes     → fetch the public boards, store new/changed postings, expire vanished ones
#   after each run       → pushes a refresh signal to connected apps
# A daily run missed while the service was down (deploy, restart) is caught up on start, and an
# empty database is filled by an initial run, so the app is never empty.
#
# Keep it at ONE instance (the scheduler and live stream live in the process) on an always-on plan:
# free web services sleep after idle time, which pauses the scheduler.
# (Prefer Render-managed cron jobs instead? See render.cron.yaml.)

databases:
  - name: jobradar-db
    databaseName: jobradar
    user: jobradar
    region: singapore          # nearest Render region to India
    plan: basic-256mb          # the free plan expires after 30 days: use it for trials only

services:
  - type: web
    name: jobradar-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: starter              # 512 MB: a real run peaks around 320 MB
    numInstances: 1
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: jobradar-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN       # your web app origin(s); native apps use the two below
        value: https://localhost,capacitor://localhost
      - key: SCHEDULER
        value: "on"
      - key: DAILY_AT
        value: "06:00"
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: REFRESH_EVERY_MINUTES
        value: "60"
      - key: BOARDS_FILE
        value: config/boards.verified.json
      - key: TARGET_ROLE
        value: fullstack
      - key: TARGET_YEARS
        value: "4"
